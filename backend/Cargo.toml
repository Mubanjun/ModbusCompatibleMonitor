[package]
name = "jdrk-monitor-backend"
version = "0.1.0"
edition = "2021"
description = "RS-QXZ-M / RS-XJZ 水质监控平台 Rust 后端（双 Modbus 规约 + SQLite 缓冲 + MySQL 回传 + REST/WebSocket）"
license = "MIT"

[[bin]]
name = "jdrk-monitor"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
serialport = "4"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
mysql = "25"

# Windows 串口：使用重叠 I/O（FILE_FLAG_OVERLAPPED），使挂起的读可被 CancelIoEx 取消。
# 这是修复"串口阻塞导致进程无法退出、端口无法释放"的关键。
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "commapi", "fileapi", "handleapi", "ioapiset", "minwindef", "minwinbase",
    "ntdef", "synchapi", "winbase", "winnt", "wincon", "consoleapi", "errhandlingapi",
    "winerror", "std",
] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
