databaseChangeLog:
  - include:
      file: db/changelog/mysql/main_table.sql
  - include:
      file: db/changelog/mysql/main_data.sql
  - include:
      file: db/changelog/mysql/plugin/plugin_open.sql
  - include:
      file: db/changelog/mysql/plugin/plugin_tenant.sql
  - include:
      file: db/changelog/mysql/plugin/plugin_schedule.sql
  - include:
      file: db/changelog/mysql/plugin/plugin_generator.sql
  # 业务域表结构（采集端口 / 设备 / 通道）
  - include:
      file: db/changelog/mysql/biz_table.sql
  # 业务域：设备模板与采集顺序、报警规则/记录/通知
  - include:
      file: db/changelog/mysql/biz_collect_alarm.sql
  # 业务域：上报配置、同步任务、系统配置与看门狗日志
  # 注意：biz_sys_config 在本文件创建，必须先于 biz_v14_group_sensor.sql 执行，
  # 否则全新数据库首次启动时 v14-6 的地图默认配置会因表不存在而失败。
  - include:
      file: db/changelog/mysql/biz_report_sync_sys.sql
  # V1.4 分组树、对象化传感器、位置字段与地图配置
  - include:
      file: db/changelog/mysql/biz_v14_group_sensor.sql
  # 业务域菜单与权限
  - include:
      file: db/changelog/mysql/biz_data.sql
  # 设备模板菜单与权限
  - include:
      file: db/changelog/mysql/biz_data2.sql
  # 报警规则菜单与权限
  - include:
      file: db/changelog/mysql/biz_data3.sql
  # 上报目标与上报模板菜单及权限
  - include:
      file: db/changelog/mysql/biz_data4.sql
  # 上报规则与采集顺序菜单及权限
  - include:
      file: db/changelog/mysql/biz_data5.sql
  # 同步任务菜单及权限
  - include:
      file: db/changelog/mysql/biz_data6.sql
  # 业务系统配置默认项
  - include:
      file: db/changelog/mysql/biz_config_data.sql
  # 业务系统配置菜单及权限
  - include:
      file: db/changelog/mysql/biz_data7.sql
  # 菜单改名（避免与基座的「系统配置」重名）
  - include:
      file: db/changelog/mysql/biz_data8.sql
  # 运行时可观测数据菜单与只读权限
  - include:
      file: db/changelog/mysql/biz_data9.sql
  # 运行时表结构：三级间隔与优先级补充、信令记录、历史数据、实时值
  - include:
      file: db/changelog/mysql/biz_runtime.sql
  # 采集内核可配置参数补全
  - include:
      file: db/changelog/mysql/biz_runtime_config.sql
  # 采集运行与信令监视菜单及权限
  - include:
      file: db/changelog/mysql/biz_runtime_data.sql
  # 历史数据表补充来源主键（暂存上传幂等去重）
  - include:
      file: db/changelog/mysql/biz_data_source.sql
  # 历史数据与实时数据菜单及权限
  - include:
      file: db/changelog/mysql/biz_data_web.sql
  # 报警通知目标配置与报警处理权限
  - include:
      file: db/changelog/mysql/biz_alarm_runtime.sql
  # 上报死信队列表与菜单权限
  - include:
      file: db/changelog/mysql/biz_report_dead_letter.sql
  # 报警 MQTT 通知 Broker 配置
  - include:
      file: db/changelog/mysql/biz_alarm_mqtt.sql
  # 同步任务执行权限
  - include:
      file: db/changelog/mysql/biz_sync_runtime.sql
  # 继电器配置、操作审计表、写保护配置与菜单权限
  - include:
      file: db/changelog/mysql/biz_relay.sql
  # 日志与诊断菜单及权限
  - include:
      file: db/changelog/mysql/biz_log.sql
  # 数据导入导出与备份恢复菜单及权限
  - include:
      file: db/changelog/mysql/biz_io.sql
  # 看门狗与自检菜单及权限
  - include:
      file: db/changelog/mysql/biz_watchdog.sql
  # 迁移向导与无损替换菜单及权限
  - include:
      file: db/changelog/mysql/biz_migration.sql
  # 历史数据修正权限
  - include:
      file: db/changelog/mysql/biz_data_correct.sql
  # 实时曲线与多视图大屏菜单及权限
  - include:
      file: db/changelog/mysql/biz_web_view.sql
  # 设备校时配置、菜单及权限
  - include:
      file: db/changelog/mysql/biz_timesync.sql
