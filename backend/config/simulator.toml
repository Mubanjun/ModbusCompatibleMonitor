# 无硬件自测配置：使用内置 Modbus 从站模拟器（RS-Modbus，地址=通道，1~32 在线）
# 启动： jdrk-monitor --config config/simulator.toml

[server]
bind = "127.0.0.1:8790"
ws_push_frames = true

[device]
sn = "SIM-QXZ-0001"
name = "模拟主机"
location = "实验室"

[poll]
enabled = true
interval_ms = 2000
round_timeout_ms = 1500

[storage]
sqlite_path = "data/simulator.db"
buffer_enabled = true

[forward]
enabled = false
batch_size = 200
max_attempts = 10

[[forward.targets]]
name = "mysql_main"
enabled = false
url = "mysql://monitor_rw:change_me@127.0.0.1:3306/env_monitor"
table = "tb_sensor_data"

[debug]
frame_log_capacity = 2000
frame_log_enabled = true

[[links]]
name = "sim"
kind = "simulator"
port = "SIM"
baud = 9600
protocol = "rs_modbus"
response_timeout_ms = 300
silence_ms = 50
retries = 1
retry_interval_ms = 50
rts_mode = "none"
chunk_regs = 124

active_link = "sim"
