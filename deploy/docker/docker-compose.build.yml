name: jdrk-docker-build-test
services:
  mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${DB_NAME:-continew_admin}
      MYSQL_USER: ${DB_USER:-jdrk}
      MYSQL_PASSWORD: ${DB_PWD:-123456}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - build-mysql-data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped
  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PWD:-123456}"]
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PWD:-123456}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped
  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.build
      target: runtime
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      DB_HOST: mysql
      REDIS_HOST: redis
    command:
      - --server.port=8000
      - "--spring.datasource.url=jdbc:mysql://mysql:3306/${DB_NAME:-continew_admin}?serverTimezone=Asia/Shanghai&useSSL=false&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"
      - --spring.datasource.username=${DB_USER:-jdrk}
      - --spring.datasource.password=${DB_PWD:-123456}
      - --spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
      - --spring.data.redis.host=redis
      - --spring.data.redis.port=6379
      - --spring.data.redis.password=${REDIS_PWD:-123456}
      - --logging.level.top.continew.admin=INFO
    ports:
      - "${BACKEND_HOST_PORT:-18000}:8000"
    restart: unless-stopped
volumes:
  build-mysql-data:
