# 功能测试覆盖：后端共享宿主网络（Linux），使后端能访问宿主 127.0.0.1 上的
# Modbus TCP(15020)/MQTT(18830) 等验收夹具——否则容器内的 127.0.0.1 指向容器自身。
# MySQL/Redis 仍为独立容器，经发布端口 127.0.0.1:13306 / 127.0.0.1:16379 访问。
# 用法：
#   sudo docker compose -f docker-compose.yml -f docker-compose.hostnet.yml up -d
name: jdrk-docker-test
services:
  backend:
    network_mode: host
    ports: !override []
    volumes:
      - ./logs:/app/logs
    command:
      - --server.port=18000
      - "--spring.datasource.url=jdbc:mysql://127.0.0.1:13306/${DB_NAME:-continew_admin}?serverTimezone=Asia/Shanghai&useSSL=false&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"
      - --spring.datasource.username=${DB_USER:-jdrk}
      - --spring.datasource.password=${DB_PWD:-123456}
      - --spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
      - --spring.data.redis.host=127.0.0.1
      - --spring.data.redis.port=16379
      - --spring.data.redis.password=${REDIS_PWD:-123456}
      - --logging.level.top.continew.admin=INFO
