# 进程管理器（原「看门狗」）配置 —— FR-WD-01~07
# 说明：所有键都可用命令行 --key=value 覆盖；service.<n>.* 出现任意一条即进入多服务模式，
#       否则按旧单服务配置解析（等价于只托管 backend 一个服务），老配置无需改动。

# ---------- 全局 ----------
# 监督周期（秒）
check.interval.seconds=15
# 运行时目录与日志
watchdog.dir=/home/ubt/jdrk/watchdog
watchdog.log=/home/ubt/jdrk/logs/watchdog.log

# ---------- 控制面（FR-WD-07） ----------
# 只监听回环；配置 token 后也可从局域网调用（X-Watchdog-Token 头）
control.enabled=true
control.host=127.0.0.1
control.port=18999
control.token=
control.log.lines=200

# ---------- 服务 1：后端 ----------
service.1.name=backend
service.1.type=java
service.1.jar=/home/ubt/jdrk/continew-admin.jar
service.1.java=java
# 生产运行参数：关闭 p6spy SQL 日志，业务日志压到 INFO（避免占满现场磁盘）
service.1.args=-Xmx1g --spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver --spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:continew_admin}?serverTimezone=Asia/Shanghai&useSSL=false&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true --logging.level.top.continew.admin=INFO
service.1.dir=/home/ubt/jdrk
service.1.log=/home/ubt/jdrk/logs/continew-admin.out.log
service.1.heartbeat.url=http://127.0.0.1:8000/monitor/watchdog/heartbeat
service.1.heartbeat.token=
service.1.heartbeat.timeout.seconds=120
service.1.start.timeout.seconds=180
service.1.restart.limit.per.hour=5
service.1.autostart=true
service.1.critical=true

# ---------- 服务 2：示例工作进程（按需启用） ----------
# type=command 的服务以「进程存活」为唯一判据，不配 heartbeat.url。
# 现场要托管采集/上报等独立进程时，照这个格式追加 service.3/4...，autostart 控制是否随管理器启动。
